services:
  # RouteX Backend FastAPI Web Service (Free Tier)
  - type: web
    name: routex-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: .
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # RouteX Frontend React SPA (Free Static Site Tier)
  - type: web
    name: routex-dashboard
    runtime: static
    region: oregon
    plan: free
    buildCommand: cd dashboard && npm install && npm run build
    staticPublishPath: ./dashboard/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://routex-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
